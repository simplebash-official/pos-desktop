services:
  document-server:
    image: ghcr.io/jana2u-pos-system/jana2u-document-server:latest
    container_name: jana2u-document-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - INTERNAL_API_KEY=${DOCUMENT_SERVER_API_KEY}
    volumes:
      - document_data:/app/data
    # PORT/DATABASE_URL/TEMPLATES_DIR/FONTS_DIR/RUST_LOG/MAX_RENDER_BODY_BYTES
    # intentionally left unset here — the image's own Dockerfile ENV defaults
    # already point at the right absolute container paths.

  backend:
    image: ghcr.io/jana2u-pos-system/jana2u-backend:latest
    container_name: jana2u-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/data/pos.db?mode=rwc}
      - MONGODB_URI=${MONGODB_URI:-}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS}
      - RETURN_WINDOW_DAYS=${RETURN_WINDOW_DAYS}
      - AUTO_SEED=${AUTO_SEED:-true}
      - DOCUMENT_SERVER_URL=http://document-server:8090
      - DOCUMENT_SERVER_API_KEY=${DOCUMENT_SERVER_API_KEY}
    volumes:
      - generated_documents:/app/generated_documents
      - backend_data:/app/data
    depends_on:
      document-server:
        condition: service_healthy

  seed:
    image: ghcr.io/jana2u-pos-system/jana2u-backend:latest
    container_name: jana2u-seed
    entrypoint: ["/app/bin/seed_all"]
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/data/pos.db?mode=rwc}
      - MONGODB_URI=${MONGODB_URI:-}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS}
      - RETURN_WINDOW_DAYS=${RETURN_WINDOW_DAYS}
      - DOCUMENT_SERVER_URL=http://document-server:8090
      - DOCUMENT_SERVER_API_KEY=${DOCUMENT_SERVER_API_KEY}
    volumes:
      - backend_data:/app/data
    profiles: ["seed"]

  frontend:
    image: ghcr.io/jana2u-pos-system/jana2u-frontend:latest
    container_name: jana2u-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: jana2u-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      document-server:
        condition: service_healthy
      frontend:
        condition: service_started

  certbot:
    image: certbot/certbot
    container_name: jana2u-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done;'

volumes:
  document_data:
  generated_documents:
  backend_data:
  certbot_certs:
  certbot_www:
