services:
  document-server:
    build:
      context: ./document-server
    container_name: jana2u-document-server
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - INTERNAL_API_KEY=${DOCUMENT_SERVER_API_KEY}
    volumes:
      - document_data:/app/data
    # PORT/DATABASE_URL/TEMPLATES_DIR/FONTS_DIR/RUST_LOG/MAX_RENDER_BODY_BYTES
    # intentionally left unset here — the image's own Dockerfile ENV defaults
    # already point at the right absolute container paths.

  backend:
    build:
      context: ./backend
    container_name: jana2u-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME}
      - RETURN_WINDOW_DAYS=${RETURN_WINDOW_DAYS}
      - DOCUMENT_SERVER_URL=http://document-server:8090
      - DOCUMENT_SERVER_API_KEY=${DOCUMENT_SERVER_API_KEY}
    volumes:
      - generated_documents:/app/generated_documents
    depends_on:
      document-server:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_APP_NAME: ${VITE_APP_NAME}
    container_name: jana2u-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:8081"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  document_data:
  generated_documents:
