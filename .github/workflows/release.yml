name: release

# Release-on-push-to-main. Every push to `main` is inspected:
#
#   * A releasable Conventional Commit since the last v* tag
#     (feat: -> minor, fix:/perf: -> patch, <type>! / BREAKING CHANGE -> bump;
#      docs/chore/ci/refactor/test/build/style -> nothing) triggers a release:
#       1. compute the next version         (scripts/ci/next-version.sh)
#       2. pull the 3 submodules to their tracked branch tips
#       3. bump package.json                (scripts/set-version.py)
#       4. commit "chore(release): vX.Y.Z [skip ci]" + annotated tag, push both to main
#       5. call desktop-build.yml to build every OS and publish the release
#
#   * Nothing releasable -> the job no-ops, no build.
#
# The commit + tag are pushed with the default GITHUB_TOKEN. A GITHUB_TOKEN push
# does NOT start another workflow run, so there is no loop and no double build;
# the "[skip ci]" marker and the "no releasable commits since the new tag" check
# are extra guards.
#
# The commit + tag push to `main` works as-is on a Free org / private repo (no
# enforced protection). If `main` ever gets a restrictive ruleset (Team plan or
# public repo), let `github-actions[bot]` bypass it (Settings -> Rules -> main ->
# Bypass list) or the push fails GH006. See .github/RELEASING.md.
#
# Manual / emergency path is unchanged: scripts/release.sh <ver> then
# `git push origin v<ver>` -> desktop-build.yml via its `push: tags: v*` trigger.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    # Releases are cut only from the official repo; forks have none of the
    # signing/publishing secrets and must not try to push commits or tags.
    if: github.repository == 'simplebash-official/pos-desktop'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.compute.outputs.release }}
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history + tags for next-version + changelog
          persist-credentials: true # keep the GITHUB_TOKEN credential for the push below

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute next version from conventional commits
        id: compute
        run: scripts/ci/next-version.sh

      # Takes the tip of each submodule's tracked branch, so whatever is merged
      # there ships in a signed update to every install. Keep `master`/`main`
      # on pos-backend, pos-frontend and document-server protected (PRs with a
      # required review, no direct pushes) — see .github/RELEASING.md.
      - name: Bump submodule pins to their tracked branches
        if: steps.compute.outputs.release == 'true'
        env:
          # Only needed while a submodule repo is still private.
          SUBMODULE_TOKEN: ${{ secrets.CI_SUBMODULE_TOKEN }}
        run: |
          if [ -n "${SUBMODULE_TOKEN}" ]; then
            git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          git submodule sync
          git submodule update --init --remote --depth 1 -- frontend backend document-server
          if [ -n "${SUBMODULE_TOKEN}" ]; then
            git config --global --unset url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf
          fi
          git submodule status

      - name: Bump version (package.json is the single source of truth)
        if: steps.compute.outputs.release == 'true'
        env:
          VERSION: ${{ steps.compute.outputs.version }}
        run: python3 scripts/set-version.py "$VERSION"

      - name: Commit + tag on main
        if: steps.compute.outputs.release == 'true'
        env:
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "${TAG}" -m "SimpleBash POS desktop ${TAG}"
          git push origin HEAD:main
          git push origin "${TAG}"

  desktop:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      publish: true
      ref: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
