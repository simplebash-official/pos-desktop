name: desktop-build

# Builds the Tauri desktop bundle for Linux + Windows + macOS and, when asked to,
# publishes a GitHub Release + the Tauri updater manifest (`latest.json`) on this
# repo (`simplebash-official/pos-desktop`) — the only release feed.
#
# Three ways in:
#   workflow_call   — `.github/workflows/release.yml` calls this after it has
#                     computed + committed + tagged the new version on `main`.
#                     This is the normal path (release-on-push-to-main).
#   workflow_dispatch — manual pre-flight: builds all 3 OSes, publishes only if
#                     you tick `publish`.
#   push: tags: v*  — emergency / offline path: `scripts/release.sh <ver>` then
#                     `git push origin v<ver>` → build + publish.
#
# Repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key (from `tauri signer generate`) — required
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password — required; generate the key WITH one
#   CI_SUBMODULE_TOKEN                  optional: only while a submodule repo is still private
#   TEMPLATES_DEPLOY_KEY                read-only deploy key for the private document-templates repo — required
#   TEMPLATES_PACK_KEY                  password for src-tauri/resources/templates.pack — required
#
# Supply-chain note: the signing key can push an update to every installed POS,
# so it is only present in the one step that needs it (`tauri build`). The
# frontend and sidecars — and every npm/cargo dependency they run — are built
# in earlier steps that never see it, and `tauri build` is told not to re-run
# them (`beforeBuildCommand: null`).
#
# OS-level code signing (Apple notarization, Windows Authenticode) is not wired
# yet — bundles are unsigned to the OS; the updater artifacts are signed.

on:
  workflow_call:
    inputs:
      version:
        description: "Version to build (X.Y.Z). Required — the caller has already bumped package.json to this."
        type: string
        required: true
      publish:
        description: "Publish the GitHub Release + latest.json after building."
        type: boolean
        default: false
      ref:
        description: "Git ref to check out (e.g. the release tag). Defaults to the triggering ref."
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the GitHub Release + latest.json after building."
        type: boolean
        default: false
      ref:
        description: "Git ref to check out. Defaults to the branch the run was started from."
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version-check:
    # Same fork guard as release.yml: tag pushes on a fork must not start a build
    # that needs the official signing/publishing secrets.
    if: github.repository == 'simplebash-official/pos-desktop'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          # package.json is the single source of truth. tauri.conf.json points at
          # it (`"version": "../package.json"`), so resolve rather than read raw.
          pkg=$(node -p "require('./package.json').version")
          resolved=$(node -p "
            const c = require('./src-tauri/tauri.conf.json');
            (typeof c.version === 'string' && c.version.endsWith('package.json'))
              ? require('./package.json').version : c.version")
          if [ "$resolved" != "$pkg" ]; then
            echo "::error::src-tauri/tauri.conf.json resolves to $resolved but package.json is $pkg"
            exit 1
          fi

          version="${INPUT_VERSION:-$pkg}"
          if [ "$version" != "$pkg" ]; then
            echo "::error::caller asked for $version but package.json is $pkg (was it committed?)"
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ] && [[ "$GIT_REF" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match version $version (run scripts/release.sh)"
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

  build:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only — GitHub's Intel `macos-13` runners are being
          # retired and their jobs queue for hours. Add `universal-apple-darwin`
          # (cross-built on this arm runner) later if an Intel Mac shows up.
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
          # The submodule repos are public, so the built-in token is enough;
          # CI_SUBMODULE_TOKEN is only needed while one of them is private.
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
          # Don't leave a credential in .git/config for later steps (and the
          # dependencies they run) to read.
          persist-credentials: false

      # Private template designs; build-sidecars.sh assembles + packs them.
      # Fails the build if the deploy key is missing, so a release can never
      # silently ship the public example templates.
      - uses: actions/checkout@v4
        with:
          repository: simplebash-official/document-templates
          path: document-templates
          ssh-key: ${{ secrets.TEMPLATES_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Linux bundling dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            backend
            document-server
            scripts/pack-templates

      - name: Install root + frontend deps (lockfile-exact)
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Configure desktop environment
        run: npm run env:desktop

      - name: Build sidecars + stage Typst assets
        shell: bash
        run: bash scripts/build-sidecars.sh
        env:
          TEMPLATES_PACK_KEY: ${{ secrets.TEMPLATES_PACK_KEY }}

      - name: Build frontend (no signing secrets in this step)
        run: npm --prefix frontend run build:tauri
        env:
          # Where the shell starts the backend. Set explicitly so the build
          # never depends on an untracked frontend/.env.tauri (v0.8.0 shipped
          # without it and every API call hit the app's own HTML instead).
          VITE_API_BASE_URL: http://127.0.0.1:8080/api

      - name: Build desktop bundle (and sign updater artifacts)
        # Sidecars and frontend were built above; `beforeBuildCommand: null`
        # stops tauri from re-running them with the signing key in the env.
        shell: bash
        run: npm run tauri build -- --config '{"build":{"beforeBuildCommand":null}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked in at compile time (`option_env!` in src-tauri/src/cloud/mod.rs).
          # Repository *variables* (Settings → Secrets and variables → Actions →
          # Variables), not literals: forks have none, so their builds stay
          # cloud-disabled instead of pointing at our servers. An unset variable
          # expands to "" which the shell treats as "no cloud URL".
          CLOUD_API_URL: ${{ vars.CLOUD_API_URL }}
          CLOUD_SYNC_API_URL: ${{ vars.CLOUD_SYNC_API_URL }}
          # Baked in (`option_env!` in orchestrator.rs) to unpack templates.pack.
          TEMPLATES_PACK_KEY: ${{ secrets.TEMPLATES_PACK_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.triple }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.sig
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*-setup.exe.sig

  publish:
    needs: [version-check, build]
    if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release on this repo
    env:
      TAG: v${{ needs.version-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundle-*

      - name: Compose release notes
        shell: bash
        run: |
          # CHANGELOG.md — just the commit list, fed to latest.json ("what's new")
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git log --no-merges --pretty='- %s' "$prev..${TAG}" > CHANGELOG.md
          else
            git log --no-merges --pretty='- %s' -15 > CHANGELOG.md
          fi

          # NOTES.md — the GitHub Release body: install steps + the changelog.
          # The bundles are not signed by Apple / Microsoft yet, so first launch
          # after a browser download is blocked by Gatekeeper / SmartScreen.
          cat > NOTES.md <<'EOF'
          ## Installing

          **macOS** — after moving the app to Applications, run once in Terminal:
          ```
          curl -fsSL https://raw.githubusercontent.com/simplebash-official/pos-desktop/main/scripts/macos-allow-app.sh | bash
          ```
          (or `xattr -dr com.apple.quarantine "/Applications/SimpleBash POS.app"`),
          then open it. Without this, macOS says the app "is damaged" — it isn't;
          the app just isn't Apple-notarized yet.

          **Windows** — SmartScreen shows "unknown publisher" → **More info → Run anyway**.

          **Updates** — once installed, use **Settings → Updates** inside the app.
          In-app updates are not quarantined, so they install without these prompts.

          ---

          ## Changes

          EOF
          cat CHANGELOG.md >> NOTES.md
          cat NOTES.md

      - name: Assemble latest.json
        id: manifest
        shell: bash
        run: |
          files=$(node scripts/ci/build-latest-json.mjs \
            --artifacts artifacts \
            --version "${{ needs.version-check.outputs.version }}" \
            --tag "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes "$(head -c 2000 CHANGELOG.md)" \
            --out latest.json)
          echo "Assets to upload:"
          echo "$files"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "--- latest.json ---"
          cat latest.json

      - name: Publish release on this repo
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_LIST: ${{ steps.manifest.outputs.files }}
        shell: bash
        run: |
          mapfile -t assets < <(printf '%s\n' "$ASSET_LIST" | sed '/^$/d')
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${assets[@]}"
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "SimpleBash POS ${TAG}" \
              --notes-file NOTES.md \
              --verify-tag \
              "${assets[@]}"
          fi
