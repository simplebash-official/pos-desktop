name: tauri-ci

# Lightweight PR check for the desktop shell (src-tauri): fmt/clippy/test only,
# no signing, no publishing, no bundling. Unlike release.yml/desktop-build.yml
# this needs no `github.repository ==` guard — it holds no privileged secrets
# and is safe to run on a fork. (A fork PR simply has no `CI_SUBMODULE_TOKEN`,
# so its submodule checkout fails cleanly rather than leaking the token —
# GitHub does not expose secrets to `pull_request` runs from forks.)
#
# `cargo check`/`clippy`/`test` on src-tauri still needs backend + document-server
# built and staged as sidecars first: `tauri_build::build()` hard-fails at
# compile time if `bundle.externalBin`'s target files don't exist (confirmed by
# temporarily hiding src-tauri/binaries/ locally and re-running `cargo check`),
# so this can't skip straight to cargo commands the way a plain Rust crate could.

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/tauri-ci.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/tauri-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: simplebash-official/pos-backend
          token: ${{ secrets.CI_SUBMODULE_TOKEN }}
          path: backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: simplebash-official/pos-frontend
          token: ${{ secrets.CI_SUBMODULE_TOKEN }}
          path: frontend

      - name: Checkout document-server
        uses: actions/checkout@v4
        with:
          repository: simplebash-official/document-server
          token: ${{ secrets.CI_SUBMODULE_TOKEN }}
          path: document-server

      - name: Install Linux bundling dependencies
        # Same package list as desktop-build.yml's ubuntu-22.04 release job —
        # tauri_build::build() links against these even for `cargo check`.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            backend
            document-server

      - name: Build sidecars + stage Typst assets
        run: bash scripts/build-sidecars.sh

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
