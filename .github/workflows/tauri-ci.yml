name: tauri-ci

# Lightweight PR check for the desktop shell (src-tauri): fmt/clippy/test only,
# no signing, no publishing, no bundling. Unlike release.yml/desktop-build.yml
# this needs no `github.repository ==` guard — it holds no privileged secrets
# and is safe to run on a fork: the submodule repos are public, so the
# built-in token clones them (GitHub never exposes secrets such as
# `CI_SUBMODULE_TOKEN` to `pull_request` runs from forks).
#
# `cargo check`/`clippy`/`test` on src-tauri still needs backend + document-server
# built and staged as sidecars first: `tauri_build::build()` hard-fails at
# compile time if `bundle.externalBin`'s target files don't exist (confirmed by
# temporarily hiding src-tauri/binaries/ locally and re-running `cargo check`),
# so this can't skip straight to cargo commands the way a plain Rust crate could.

permissions:
  contents: read

on:
  # No `paths` filter on pull_request: a submodule pin bump (bump-submodule.yml)
  # changes only a gitlink, which GitHub's path filter never matched, so the
  # check on those PRs silently did not run. Building the sidecars from the new
  # pins is the check; it is free on a public repo.
  pull_request:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/tauri-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # CI_SUBMODULE_TOKEN only matters while a submodule repo is private.
          token: ${{ secrets.CI_SUBMODULE_TOKEN || github.token }}
          persist-credentials: false

      - name: Install Linux bundling dependencies
        # Same package list as desktop-build.yml's ubuntu-22.04 release job —
        # tauri_build::build() links against these even for `cargo check`.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            backend
            document-server

      - name: Build sidecars + stage Typst assets
        run: bash scripts/build-sidecars.sh

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
