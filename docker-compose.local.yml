services:
  document-server:
    build:
      context: ./document-server
      dockerfile: Dockerfile
    container_name: jana2u-document-server
    restart: unless-stopped
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - INTERNAL_API_KEY=${DOCUMENT_SERVER_API_KEY}
    volumes:
      - document_data:/app/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jana2u-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME}
      - RETURN_WINDOW_DAYS=${RETURN_WINDOW_DAYS}
      - DOCUMENT_SERVER_URL=http://document-server:8090
      - DOCUMENT_SERVER_API_KEY=${DOCUMENT_SERVER_API_KEY}
    volumes:
      - generated_documents:/app/generated_documents
    depends_on:
      document-server:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api}
        - VITE_APP_NAME=${VITE_APP_NAME:-Jana2U POS}
    container_name: jana2u-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  document_data:
  generated_documents:
