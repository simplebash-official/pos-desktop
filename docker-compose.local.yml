services:
  document-server:
    build:
      context: ./document-server
      dockerfile: Dockerfile
    container_name: simplebash-document-server
    restart: unless-stopped
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - INTERNAL_API_KEY=${DOCUMENT_SERVER_API_KEY}
    volumes:
      - document_data:/app/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simplebash-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/data/pos.db?mode=rwc}
      - MONGODB_URI=${MONGODB_URI:-}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS}
      - RETURN_WINDOW_DAYS=${RETURN_WINDOW_DAYS}
      - AUTO_SEED=${AUTO_SEED:-true}
      - DOCUMENT_SERVER_URL=http://document-server:8090
      - DOCUMENT_SERVER_API_KEY=${DOCUMENT_SERVER_API_KEY}
    volumes:
      - generated_documents:/app/generated_documents
      - backend_data:/app/data
    depends_on:
      document-server:
        condition: service_healthy

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simplebash-seed
    entrypoint: ["/app/bin/seed_all"]
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/data/pos.db?mode=rwc}
      - MONGODB_URI=${MONGODB_URI:-}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS}
      - RETURN_WINDOW_DAYS=${RETURN_WINDOW_DAYS}
      - DOCUMENT_SERVER_URL=http://document-server:8090
      - DOCUMENT_SERVER_API_KEY=${DOCUMENT_SERVER_API_KEY}
    volumes:
      - backend_data:/app/data
    profiles: ["seed"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api}
        - VITE_APP_NAME=${VITE_APP_NAME:-SimpleBash POS}
    container_name: simplebash-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Optional self-hosted MongoDB service for local testing.
  # Enable with: docker compose -f docker-compose.local.yml --profile mongo up -d
  mongo:
    image: mongo:7.0
    container_name: simplebash-mongo-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: ["mongo"]

volumes:
  document_data:
  generated_documents:
  backend_data:
  mongo_data:
