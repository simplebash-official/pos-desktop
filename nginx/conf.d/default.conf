# ==============================================================================
# Jana2U POS - Nginx Reverse Proxy Configuration
# ==============================================================================

# --- HTTP Server (Port 80) ---
# Handles ACME challenges for Certbot and routes/redirects traffic
server {
    listen 80;
    listen [::]:80;
    server_name localhost; # Replace with your domain name (e.g. pos.yourdomain.com)

    # Let's Encrypt ACME challenge endpoint for SSL certificate issuance & renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Frontend Single Page App
    location / {
        proxy_pass http://frontend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for document generation & heavy operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend Swagger UI & OpenAPI Docs
    location /docs {
        proxy_pass http://backend:8080/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs/ {
        proxy_pass http://backend:8080/api-docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uncomment this block to force HTTPS redirect once SSL certificates are obtained:
    # location / {
    #     return 301 https://$host$request_uri;
    # }
}

