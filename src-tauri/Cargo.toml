[package]
name = "simplebash-pos-desktop"
# Not the app version — see /package.json. tauri.conf.json points its "version"
# there, and the runtime reads app.package_info().version. This is left frozen
# on purpose; the release pipeline no longer bumps it.
version = "0.2.1"
description = "Tauri desktop bundle of the SimpleBash POS frontend + backend + document-server"
authors = ["SimpleBash"]
license = "AGPL-3.0-only"
publish = false
repository = ""
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.3.6"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "signal", "sync"] }
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Unified activity log (src/logging): IANA zone name, day gzip, redaction, export.
iana-time-zone = "0.1"
flate2 = "1"
regex = "1"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Optional cloud account link (src/cloud): tokens + device key live in the OS keychain.
keyring = { version = "3", default-features = false }
ed25519-dalek = { version = "2", features = ["rand_core"] }
tauri-plugin-devtools = "2.2.1"
# Sync agent (src/sync): HS256 service token for the local backend.
hmac = "0.12"
sha2 = "0.10"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSPrintPanel"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
